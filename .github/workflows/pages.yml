name: Deploy Repo_Dex Pages and public evidence feed

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test scanner contracts
        run: python3 -m unittest discover -s tests -v
      - name: Generate validated public-only snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/repo-dex"
          if [ -f docs/feed/latest.json ]; then
            python3 scripts/scan_public.py --owner westkitty --previous docs/feed/latest.json --output "$RUNNER_TEMP/repo-dex/latest.json" --max-source-repos 36
          else
            python3 scripts/scan_public.py --owner westkitty --output "$RUNNER_TEMP/repo-dex/latest.json" --max-source-repos 36
          fi
      - name: Commit changed evidence snapshot only
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/repo-dex/latest.json" docs/feed/latest.json <<'PY'
          import json
          import pathlib
          import sys
          candidate = pathlib.Path(sys.argv[1])
          published = pathlib.Path(sys.argv[2])
          new = json.loads(candidate.read_text(encoding='utf-8'))
          assert new['schema'] == 'repo-dex-feed/v1'
          assert new['owner'] == 'westkitty'
          assert new['inventory']['complete'] is True
          assert new['source']['visibility'] == 'public-only'
          old = json.loads(published.read_text(encoding='utf-8')) if published.is_file() else {}
          if old.get('content_sha256') == new['content_sha256']:
              print('No semantic change: preserving previous evidence snapshot')
          else:
              published.parent.mkdir(parents=True, exist_ok=True)
              published.write_bytes(candidate.read_bytes())
              print('Verified evidence changed: staging updated public feed')
          PY
          git add docs/feed/latest.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore(feed): preserve verified public evidence snapshot'
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site and feed
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
