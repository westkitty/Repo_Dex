name: Deploy Repo_Dex Pages and public evidence feed

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test scanner contracts
        run: python3 -m unittest discover -s tests -v
      - name: Generate validated public-only snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/repo-dex"
          if [ -f docs/feed/latest.json ]; then
            python3 scripts/scan_public.py --owner westkitty --previous docs/feed/latest.json --output "$RUNNER_TEMP/repo-dex/latest.json" --max-source-repos 36
          else
            python3 scripts/scan_public.py --owner westkitty --output "$RUNNER_TEMP/repo-dex/latest.json" --max-source-repos 36
          fi
      - name: Preserve changed feed and successful-scan receipt
        shell: bash
        run: |
          python3 scripts/publish_feed.py \
            --candidate "$RUNNER_TEMP/repo-dex/latest.json" \
            --published docs/feed/latest.json \
            --status docs/feed/status.json \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "https://github.com/westkitty/Repo_Dex/actions/runs/$GITHUB_RUN_ID"
          git add docs/feed/latest.json docs/feed/status.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore(feed): preserve verified public evidence and scan receipt'
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site and feed
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
